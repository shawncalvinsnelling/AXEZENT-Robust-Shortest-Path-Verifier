name: Mathematical verifier tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact verification test suite
        run: python -m unittest discover -s tests -v
      - name: Run adversarial mutation suite
        run: python scripts/adversarial_stress.py
      - name: Check example CLI
        run: |
          python src/gaugerail.py examples/robust_route.json --verify examples/robust_certificate.json
          python src/gaugerail.py examples/robust_route.json --correlated-box examples/correlated_box.json
